<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智囊 · Braintrust</title>
  <link rel="stylesheet" href="launch.css">
  <script src="start.js" defer></script>
</head>
<body>
  <main aria-labelledby="launch-title">
    <p class="eyebrow">BRAINTRUST</p>
    <h1 id="launch-title">智囊</h1>
    <p class="subtitle">好想法，一起想。</p>
    <progress id="launch-progress" max="3" value="1" aria-label="启动进度"></progress>
    <p id="launch-status" role="status" aria-live="polite">正在连接 Edge 中的智囊…</p>
    <p id="launch-version"></p>
    <button id="launch-retry" type="button" hidden>重试连接</button>
    <p id="launch-help" hidden>请通过桌面或开始菜单的「智囊」图标启动；直接打开 Edge 不会加载智囊扩展。若仍无法打开，请重新运行官方安装命令。</p>
  </main>
</body>
</html>
