<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智囊 · Braintrust</title>
<link rel="stylesheet" href="workbench.css">
</head>
<body>
<div id="startup-overlay" role="status" aria-live="polite">
  <div class="startup-card">
    <div class="startup-copy">
      <strong>智囊</strong>
      <span id="startup-text">正在启动工作台…</span>
    </div>
    <div class="startup-track"><div class="startup-bar"></div></div>
  </div>
</div>
<div id="topbar">
  <span id="title">
    <span class="brand-copy">
      <strong>智囊</strong>
      <small>Braintrust</small>
    </span>
  </span>
  <textarea id="question" placeholder="输入问题（Enter 换行，Ctrl↩ 或点「发送」同步到所有勾选的模型）"></textarea>
  <button id="mic" title="语音输入（再次点击结束）">🎤</button>
  <button id="send" disabled>发送</button>
</div>
<div id="attachbar">
  <input type="file" id="file-input" multiple style="display:none">
  <button id="attach-btn" title="添加文件/图片">📎&nbsp; 附件</button>
  <div id="attach-chips"></div>
  <span id="attach-hint">可拖入文件/图片，或 Ctrl+V 粘贴图片</span>
</div>
<div id="controls">
  <div id="platform-controls">
    <div id="checks"></div>
    <div id="paging" style="display:none">
      <button id="page-left" title="上一页窗格">◀</button>
      <span id="page-ind"></span>
      <button id="page-right" title="下一页窗格">▶</button>
    </div>
    <span id="progress"></span>
  </div>
  <div id="update-banner" role="group" aria-label="软件更新" data-state="idle">
    <span id="update-version" title="当前版本"></span>
    <button id="update-btn" type="button">检查更新 / Check updates</button>
    <span id="update-status" role="status" aria-live="polite"></span>
  </div>
</div>
<div id="panes"></div>
<script src="/config.js"></script>
<script src="workbench-local.js"></script>
</body>
</html>
