<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下载 macOS · Braintrust｜智囊</title>
  <meta name="theme-color" content="#f4f4f6">
  <link rel="canonical" href="https://braintrust.chat/download/macos/">
  <link rel="icon" href="../../assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <main class="stage">
    <section class="card download-card" aria-label="下载 macOS">
      <div class="brand">
        <a href="../../"><img class="mark" src="../../assets/mark.svg" alt="" width="46" height="46"><h1>Braintrust<span class="bar">｜</span><span class="cn">智囊</span></h1></a>
      </div>
      <p class="tagline" id="status">正在准备下载…</p>
      <a class="repo" id="fallback" href="https://github.com/porcelaintech/parallel-workshop/releases" target="_blank" rel="noreferrer">GitHub<span class="arrow" aria-hidden="true">↗</span></a>
      <a class="back" href="../../">返回</a>
    </section>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const response = await fetch(`../../updates/local-service-update.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error('not-ready');
        const manifest = await response.json();
        const artifact = manifest.artifacts?.['darwin-universal'];
        if (!artifact?.url) throw new Error('not-ready');
        if (!/^https:\/\/github\.com\/porcelaintech\/parallel-workshop\/releases\//.test(artifact.url)) throw new Error('bad-url');
        status.textContent = '正在前往 GitHub…';
        window.location.replace(artifact.url);
      } catch {
        status.textContent = '安装包尚未发布。';
      }
    })();
  </script>
</body>
</html>
