name: Local service Windows install smoke

on:
  push:
    branches: [release/local-service]
    paths:
      - 'distribution/windows/**'
      - 'distribution/assets/**'
      - 'local-service/**'
      - 'scripts/local-service-windows-smoke.ps1'
      - '.github/workflows/local-service-windows-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BRAINTRUST_NO_DIALOG: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Parse PowerShell and check BOM
        shell: powershell
        run: |
          $files = @(
            'distribution\windows\install.ps1',
            'distribution\windows\launcher.ps1',
            'scripts\local-service-windows-smoke.ps1'
          )
          foreach ($file in $files) {
            $path = (Resolve-Path $file).Path
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "$file lacks UTF-8 BOM"
            }
          }

      - name: Prepare distribution payload
        shell: powershell
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'braintrust-dist'
          Remove-Item -LiteralPath $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $dist 'local-service') -Force | Out-Null
          Copy-Item -Path 'local-service\*' -Destination (Join-Path $dist 'local-service') -Recurse -Force

          $adapters = Join-Path $dist 'local-service\data\adapters'
          New-Item -ItemType Directory -Path $adapters -Force | Out-Null
          Copy-Item -Path 'Sources\WorkbenchCore\Resources\adapters\*.json' -Destination $adapters -Force
          Copy-Item -Path 'Sources\WorkbenchCore\Resources\injection\*.js' -Destination (Join-Path $dist 'local-service\data') -Force

          $nodeDir = Join-Path $dist 'local-service\runtime\node-win-x64'
          New-Item -ItemType Directory -Path $nodeDir -Force | Out-Null
          Copy-Item -LiteralPath (Get-Command node.exe).Source -Destination (Join-Path $nodeDir 'node.exe') -Force

          Copy-Item -Path 'distribution\windows\install.bat' -Destination $dist -Force
          Copy-Item -Path 'distribution\windows\install.ps1' -Destination $dist -Force
          Copy-Item -Path 'distribution\windows\launcher.ps1' -Destination $dist -Force
          Copy-Item -Path 'distribution\windows\README.txt' -Destination $dist -Force
          $assets = Join-Path $dist 'assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item -Path 'distribution\assets\AppIcon.ico' -Destination $assets -Force

      - name: Run install.bat without launching
        shell: cmd
        run: |
          cd /d "%RUNNER_TEMP%\braintrust-dist"
          call install.bat -NoLaunch
          if errorlevel 1 exit /b 1

      - name: Verify install layout, shortcut and API
        shell: powershell
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Braintrust\service'
          $required = @(
            'server.mjs', 'package.json', 'launcher.ps1',
            'runtime\node-win-x64\node.exe',
            'data\adapters\chatgpt.json',
            'data\adapters\deepseek.json',
            'data\adapters\doubao.json',
            'data\adapters\kimi.json',
            'data\adapters\tongyi.json',
            'data\adapters\yiyan.json'
          )
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $item))) { throw "missing $item" }
          }

          $desktop = [Environment]::GetFolderPath('Desktop')
          # 不依赖中文文件名：按 Arguments 里的 Braintrust\service\launcher.ps1 认出我们的快捷方式。
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $null
          foreach ($file in @(Get-ChildItem -LiteralPath $desktop -Filter '*.lnk' -ErrorAction SilentlyContinue)) {
            $candidate = $shell.CreateShortcut($file.FullName)
            if ($candidate.Arguments -like '*Braintrust*launcher.ps1*') { $shortcut = $candidate; break }
          }
          if (-not $shortcut) { throw 'Installer shortcut not found on Desktop' }
          if ($shortcut.TargetPath -notlike '*powershell.exe') { throw "unexpected shortcut target: $($shortcut.TargetPath)" }
          if ($shortcut.IconLocation -notlike '*AppIcon.ico*') { throw "unexpected icon: $($shortcut.IconLocation)" }

          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\local-service-windows-smoke.ps1') -ServiceRoot $root

      - name: Launcher and headless browser smoke
        shell: powershell
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Braintrust\service'
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path $env:LOCALAPPDATA 'Microsoft\Edge\Application\msedge.exe')
          )
          $edge = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge not found on runner' }
          $env:BRAINTRUST_BROWSER_PATH = $edge
          $env:BRAINTRUST_BROWSER_HEADLESS = '1'
          $env:BRAINTRUST_NO_DIALOG = '1'
          Write-Host "browser=$edge"
          & (Join-Path $root 'launcher.ps1')
          $serviceJson = Join-Path $env:LOCALAPPDATA 'Braintrust\data\service.json'
          for ($i = 0; $i -lt 100 -and -not (Test-Path -LiteralPath $serviceJson); $i++) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path -LiteralPath $serviceJson)) { throw 'service.json missing after launcher' }
          $info = Get-Content -LiteralPath $serviceJson -Raw -Encoding UTF8 | ConvertFrom-Json
          try {
            $headers = @{ Authorization = "Bearer $($info.token)" }
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:$($info.port)/api/health" -Headers $headers -TimeoutSec 10
            if (-not $health.browser.running) { throw 'browser is not running' }
            if ([string]$health.browser.version.Browser -notlike 'Edg/*') { throw "unexpected browser: $($health.browser.version.Browser)" }
            Write-Host "✅ Windows launcher + headless Edge + CDP OK: $($health.browser.version.Browser)"
            Invoke-RestMethod -Uri "http://127.0.0.1:$($info.port)/api/quit" -Method Post -Headers $headers -ContentType 'application/json' -Body '{}' -TimeoutSec 10 | Out-Null
          } finally {
            if ($info.pid) { Stop-Process -Id $info.pid -Force -ErrorAction SilentlyContinue }
          }
