name: Release local service

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（X.Y.Z）'
        required: true
        default: '0.6.0'

permissions:
  contents: write

jobs:
  build-and-draft:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "require('./local-service/package.json').version")" = "$VERSION"

      - name: Syntax and contract checks
        run: |
          bash -n distribution/macos/install.command distribution/macos/launcher.sh
          bash -n distribution/scripts/build-release.sh
          node --check local-service/server.mjs
          node --check local-service/lib/browser.mjs
          node --check local-service/public/app.js
          node scripts/local-service-contract-test.mjs
          node scripts/local-service-update-test.mjs

      - name: Build release artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash distribution/scripts/build-release.sh "$VERSION"
          unzip -t "build/local-service-release/$VERSION/artifacts/Braintrust-local-service-macos-$VERSION.zip"
          unzip -t "build/local-service-release/$VERSION/artifacts/Braintrust-local-service-windows-$VERSION.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-service-${{ inputs.version }}
          path: build/local-service-release/${{ inputs.version }}/artifacts/
          if-no-files-found: error

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: 智囊 v${{ inputs.version }}
          draft: true
          prerelease: false
          body_path: build/local-service-release/${{ inputs.version }}/artifacts/RELEASE_NOTES.md
          files: build/local-service-release/${{ inputs.version }}/artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
