name: Windows Unicode shortcut recheck

on:
  workflow_dispatch:
  push:
    branches: [release/local-service]
    paths: ['.github/workflows/windows-unicode-recheck.yml']

permissions:
  contents: read
  actions: read

jobs:
  unicode:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      CI: 'true'
      BRAINTRUST_NO_DIALOG: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40283324486
          name: windows-candidate
          path: candidate/
      - name: Observe shortcut Unicode arguments and actual shell launch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $proof=Get-Content candidate\build-proof.json -Raw | ConvertFrom-Json
          if ($proof.sourceCommit -ne '61e69dbcf217a6aa45a4e5e1fb27067537b1d712') { throw 'Wrong source artifact' }
          $setup=Join-Path (Resolve-Path candidate) $proof.installer.name
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne $proof.installer.sha256) { throw 'Wrong candidate bytes' }
          $folder=-join @([char]0x6d4b,[char]0x8bd5,[char]0x20,[char]0x7528,[char]0x6237)
          $root=Join-Path $env:RUNNER_TEMP ($folder+'\Braintrust App')
          $serviceRoot=Join-Path $root 'service'
          $process=Start-Process $setup -ArgumentList ('/S /D='+$root) -PassThru
          if (-not $process.WaitForExit(90000)) { throw 'Install timeout' }
          if ($process.ExitCode -ne 0) { throw 'Install failed' }
          $expected='"'+(Join-Path $serviceRoot 'launcher.vbs')+'"'
          $shell=New-Object -ComObject WScript.Shell
          $link=Join-Path ([Environment]::GetFolderPath('Desktop')) 'Braintrust.lnk'
          $shortcut=$shell.CreateShortcut($link)
          @{expected=$expected;actual=$shortcut.Arguments;target=$shortcut.TargetPath;icon=$shortcut.IconLocation;actualCodepoints=@($shortcut.Arguments.ToCharArray()|ForEach-Object{[int]$_});expectedCodepoints=@($expected.ToCharArray()|ForEach-Object{[int]$_})} | ConvertTo-Json -Depth 5 | Set-Content evidence\shortcut.json -Encoding UTF8
          Start-Process $link
          $info=Join-Path $env:LOCALAPPDATA 'Braintrust\data\service.json'
          $ready=$false
          for ($i=0;$i -lt 100;$i++) {
            try {
              $state=Get-Content $info -Raw | ConvertFrom-Json
              $health=Invoke-RestMethod "http://127.0.0.1:$($state.port)/api/health" -Headers @{Authorization="Bearer $($state.token)"} -TimeoutSec 2
              if ($health.browser.version.Browser) {$ready=$true;break}
            } catch {}
            Start-Sleep -Milliseconds 500
          }
          @{passed=$ready;version=$proof.version;sourceCommit=$proof.sourceCommit;sha256=$proof.installer.sha256;installDirectory=$root} | ConvertTo-Json | Set-Content evidence\launch.json -Encoding UTF8
          if (-not $ready) {throw 'Desktop shortcut did not start workbench under real Chinese install path'}
          & (Join-Path $serviceRoot 'runtime\node-win-x64\node.exe') scripts\windows-installed-ui-test.mjs --service-info $info --evidence evidence\ui
          if ($LASTEXITCODE -ne 0) {throw 'Chinese path installed UI failed'}
      - name: Clean up exact test installation
        if: always()
        shell: powershell
        run: |
          $folder=-join @([char]0x6d4b,[char]0x8bd5,[char]0x20,[char]0x7528,[char]0x6237)
          $root=Join-Path $env:RUNNER_TEMP ($folder+'\Braintrust App')
          $stop=Join-Path $root 'service\stop.ps1'
          if(Test-Path $stop){& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $stop -ServiceRoot (Join-Path $root 'service')}
          $un=Join-Path $root 'Uninstall.exe'
          if(Test-Path $un){$copy=Join-Path $env:RUNNER_TEMP 'unicode-uninstall.exe';Copy-Item $un $copy;$p=Start-Process $copy -ArgumentList ('/S _?='+$root) -PassThru;if(-not $p.WaitForExit(30000)){throw 'Cleanup timeout'}}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unicode-recheck-evidence
          path: evidence/
