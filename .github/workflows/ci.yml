name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install QA dependencies
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      - name: Swift and extension QA
        run: bash scripts/qa.sh
      - name: Verify distributable extension archive
        run: |
          unzip -t build/edge-extension.zip
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('build/edge-extension.zip') as archive:
              names = archive.namelist()
          assert names and all(name == 'edge-extension/' or name.startswith('edge-extension/') for name in names)
          assert 'edge-extension/manifest.json' in names
          assert 'edge-extension/install.bat' in names
          assert 'edge-extension/distribution.json' in names
          assert 'edge-extension/lib/model-preference.js' in names
          with zipfile.ZipFile('build/edge-extension-store.zip') as archive:
              store_names = archive.namelist()
              store_manifest = json.loads(archive.read('manifest.json'))
              store_distribution = json.loads(archive.read('distribution.json'))
          assert 'manifest.json' in store_names
          assert not any(name.startswith('edge-extension/') for name in store_names)
          assert 'key' not in store_manifest
          assert not any('github.com' in item or 'githubusercontent.com' in item
                         for item in store_manifest.get('host_permissions', []))
          store_files = {name for name in store_names if not name.endswith('/')}
          expected = {
              'manifest.json', 'distribution.json', 'background.js', 'auth-bridge.js', 'intercept.js', 'content.js',
              'workbench.html', 'workbench.js', 'workbench.css', 'lib/model-preference.js',
              'launch.html', 'launch.js', 'launch.css',
              'lib/adapters/index.json',
              'icons/16.png', 'icons/32.png', 'icons/48.png', 'icons/128.png'
          }
          assert store_files == expected
          assert store_distribution == {'channel': 'edge-addons'}
          PY
      - name: Verify idempotent universal macOS packaging
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("Windows/edge-extension/manifest.json"))["version"])')"
          VERSION="$VERSION" bash scripts/package-app.sh
          VERSION="$VERSION" bash scripts/package-app.sh
          APP_ARCHS="$(lipo -archs build/ParallelWorkbench.app/Contents/MacOS/ParallelWorkbench)"
          [[ " $APP_ARCHS " == *" arm64 "* && " $APP_ARCHS " == *" x86_64 "* ]]
          test "$(wc -w <<< "$APP_ARCHS" | tr -d ' ')" -eq 2
          test "$(lipo -archs .build/package-app/arm64-apple-macosx/release/ParallelWorkbench)" = "arm64"
          test "$(lipo -archs .build/package-app/x86_64-apple-macosx/release/ParallelWorkbench)" = "x86_64"
          test "$(plutil -extract CFBundleShortVersionString raw build/ParallelWorkbench.app/Contents/Info.plist)" = "$VERSION"

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PWB_TEST_INSTALL_RELATIVE: 测试 用户\Parallel Workbench
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)" }
          $files = @(
            'install-windows.ps1',
            'Windows\edge-extension\install.ps1',
            'Windows\edge-extension\launch.ps1',
            'scripts\windows-installer-behavior-test.ps1',
            'scripts\windows-device-preflight.ps1',
            'scripts\windows-device-live-test.ps1'
          )
          foreach ($file in $files) {
            $path = (Resolve-Path $file).Path
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $details = ($errors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }) -join "`n"
              throw "PowerShell 5.1 parse failed:`n$details"
            }
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "$file lacks the UTF-8 BOM required by Windows PowerShell 5.1"
            }
          }
      - name: Verify fast metadata and existing-profile routing
        shell: powershell
        run: .\scripts\windows-installer-behavior-test.ps1
      - name: Build local user archive
        shell: powershell
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP '安装 包'
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item -Path 'Windows\edge-extension' -Destination $packageRoot -Recurse -Force
          $metadata = Join-Path $packageRoot 'edge-extension\_metadata'
          New-Item -ItemType Directory -Path $metadata -Force | Out-Null
          Set-Content -Path (Join-Path $metadata 'stale-cache') -Value 'must not be installed'
          Compress-Archive -Path (Join-Path $packageRoot 'edge-extension') -DestinationPath "$env:RUNNER_TEMP\edge-extension.zip" -Force
      - name: Run isolated Windows device harness
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'edge-extension.zip'
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          $preflightText = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `
            '.\scripts\windows-device-preflight.ps1' -InstallRoot (Join-Path $env:RUNNER_TEMP '预检 路径') | Out-String
          if ($LASTEXITCODE -ne 0) { throw "preflight failed: $LASTEXITCODE" }
          $preflight = $preflightText | ConvertFrom-Json
          if (-not $preflight.readOnly -or $preflight.remoteLoginVerified) { throw 'preflight boundary summary is invalid' }

          $liveText = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `
            '.\scripts\windows-device-live-test.ps1' -ArchivePath $archive -ExpectedSHA256 $digest `
            -TemporaryBase $env:RUNNER_TEMP | Out-String
          if ($LASTEXITCODE -ne 0) { throw "device harness failed: $LASTEXITCODE`n$liveText" }
          $live = $liveText | ConvertFrom-Json
          if (-not $live.success -or -not $live.candidate.trustedInstallerScriptsMatched) { throw 'device harness trust check failed' }
          if (-not $live.isolation.requestedNoLaunch -or -not $live.isolation.requestedNoClipboard) { throw 'device harness isolation flags missing' }
          if (-not $live.isolation.cleanedUp) { throw 'device harness did not clean its isolated directory' }
      - name: Verify bounded fixed bootstrap command
        shell: powershell
        run: |
          $downloaded = Join-Path $env:RUNNER_TEMP ('ParallelWorkbench-install-' + [Guid]::NewGuid().ToString('N') + '.ps1')
          $url = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install-windows.ps1"
          try {
            & curl.exe --fail --location --silent --show-error --retry 3 --retry-max-time 90 --connect-timeout 10 --max-time 60 $url --output $downloaded
            if ($LASTEXITCODE -ne 0) { throw "bootstrap curl failed: $LASTEXITCODE" }
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $downloaded -ArchivePath "$env:RUNNER_TEMP\edge-extension.zip" -NoLaunch -NoShortcuts -NoClipboard -VerifyOnly
            if ($LASTEXITCODE -ne 0) { throw "downloaded bootstrap failed: $LASTEXITCODE" }
          } finally {
            Remove-Item -LiteralPath $downloaded -Force -ErrorAction SilentlyContinue
          }
      - name: Verify fast installer in non-ASCII and spaced path
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP $env:PWB_TEST_INSTALL_RELATIVE
          $verifyTarget = Join-Path $env:RUNNER_TEMP 'verify must stay absent'
          .\install-windows.ps1 -ArchivePath "$env:RUNNER_TEMP\edge-extension.zip" -InstallRoot $verifyTarget -NoLaunch -NoShortcuts -NoClipboard -VerifyOnly
          if (Test-Path $verifyTarget) { throw 'VerifyOnly unexpectedly wrote to InstallRoot' }
          $elapsed = Measure-Command {
            .\install-windows.ps1 -ArchivePath "$env:RUNNER_TEMP\edge-extension.zip" -InstallRoot $target -NoLaunch -NoShortcuts -NoClipboard
          }
          if ($elapsed.TotalSeconds -gt 120) { throw "Installer took $($elapsed.TotalSeconds) seconds" }
          $currentFile = Join-Path $target 'current.txt'
          if (-not (Test-Path $currentFile)) { throw 'current.txt missing after install' }
          $installed = Join-Path $target ('edge-extension-' + ((Get-Content $currentFile -Raw -Encoding UTF8).Trim()))
          if (-not (Test-Path (Join-Path $installed 'manifest.json'))) { throw 'manifest missing after install' }
          $expectedVersion = (Get-Content 'Windows\edge-extension\manifest.json' -Raw | ConvertFrom-Json).version
          if ((Get-Content (Join-Path $installed 'manifest.json') -Raw | ConvertFrom-Json).version -ne $expectedVersion) { throw 'version mismatch' }
          if (Test-Path (Join-Path $installed '_metadata')) { throw 'stale Edge _metadata cache was installed' }
          $recordedPath = (Get-Content (Join-Path $target 'EXTENSION_PATH.txt') -Raw -Encoding UTF8).Trim()
          if ($recordedPath -ne $installed) { throw 'EXTENSION_PATH.txt mismatch' }
          $launch = & (Join-Path $installed 'launch.ps1') -PrintOnly | ConvertFrom-Json
          if ($launch.WorkbenchURL -ne 'chrome-extension://mklpdfdkbchlahfahofajchfjphlpkek/launch.html') { throw 'launcher URL mismatch' }
          if (-not $launch.Arguments.Contains('--load-extension="' + $installed + '"')) { throw 'launcher must load the installed extension via command line' }
          if (-not $launch.Arguments.Contains('--user-data-dir=')) { throw 'launcher must use a dedicated Edge profile' }
          if ($launch.Arguments -match 'about:blank') { throw 'launcher must not warm blank tabs' }
      - name: Verify idempotent reinstall and source-in-target update
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP $env:PWB_TEST_INSTALL_RELATIVE
          $currentFile = Join-Path $target 'current.txt'
          $source = Join-Path $target ('edge-extension-' + ((Get-Content $currentFile -Raw -Encoding UTF8).Trim()))
          Push-Location $source
          try {
            & '.\install.ps1' -SourceDir $source -TargetRoot $target -NoLaunch -NoShortcuts -NoClipboard
          } finally {
            Pop-Location
          }
          $expectedVersion = (Get-Content 'Windows\edge-extension\manifest.json' -Raw | ConvertFrom-Json).version
          if ((Get-Content (Join-Path $source 'manifest.json') -Raw | ConvertFrom-Json).version -ne $expectedVersion) {
            throw 'idempotent reinstall failed'
          }
          if ((Get-Content (Join-Path $target 'current.txt') -Raw -Encoding UTF8).Trim() -ne $expectedVersion) {
            throw 'current.txt drifted'
          }
          if (@(Get-ChildItem -LiteralPath $target -Force | Where-Object { $_.Name -like '.edge-extension.*' }).Count -ne 0) {
            throw 'installer left staging or backup directories behind'
          }
      - name: Verify malformed archive returns failure
        shell: powershell
        run: |
          $badRoot = Join-Path $env:RUNNER_TEMP 'invalid package\edge-extension'
          New-Item -ItemType Directory -Path $badRoot -Force | Out-Null
          Set-Content -Path (Join-Path $badRoot 'not-a-manifest.txt') -Value 'invalid'
          $badZip = Join-Path $env:RUNNER_TEMP 'invalid edge-extension.zip'
          Compress-Archive -Path $badRoot -DestinationPath $badZip -Force
          $script = (Resolve-Path '.\install-windows.ps1').Path
          $command = "& '$($script.Replace("'", "''"))' -ArchivePath '$($badZip.Replace("'", "''"))' -VerifyOnly"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($command))
          $process = Start-Process -FilePath powershell.exe -ArgumentList @(
            '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-EncodedCommand', $encoded
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -eq 0) { throw 'malformed archive incorrectly returned exit code 0' }
      - name: Verify enterprise policy mode refuses non-domain machines
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'enterprise must not install'
          $refused = $false
          try {
            .\install-windows.ps1 -ArchivePath "$env:RUNNER_TEMP\edge-extension.zip" -InstallRoot $target -NoLaunch -NoShortcuts -NoClipboard -Enterprise
          } catch {
            $refused = ($_.Exception.Message -match 'Active Directory')
          }
          if (-not $refused) { throw 'enterprise mode must refuse non-domain-joined machines with the official constraint message' }
          if (Test-Path $target) { throw 'enterprise refusal must not install any files' }
      - name: Verify installed package in real Windows Edge
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP $env:PWB_TEST_INSTALL_RELATIVE
          $installed = Join-Path $target ('edge-extension-' + ((Get-Content (Join-Path $target 'current.txt') -Raw -Encoding UTF8).Trim()))
          $launch = & (Join-Path $installed 'launch.ps1') -PrintOnly | ConvertFrom-Json
          $env:PWB_EDGE_BINARY = $launch.EdgePath
          $env:PWB_EDGE_SOURCE = $installed
          $env:PWB_EDGE_EVIDENCE = Join-Path $env:GITHUB_WORKSPACE 'build\windows-edge-live'
          node scripts/windows-edge-live-test.mjs
          if ($LASTEXITCODE -ne 0) {
            $nodeExit = $LASTEXITCODE
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match '\bnode\.exe\b' } | Select-Object -First 2 | ForEach-Object { Write-Host $_.Message }
            throw "Real Windows Edge launch failed: $nodeExit"
          }
      - name: Upload raw Windows Edge launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-edge-live-evidence
          path: build/windows-edge-live
          if-no-files-found: ignore
